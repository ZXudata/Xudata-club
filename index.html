<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Xudata.绪白信息社社区</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/zpix-webfont@1.0.0/zpix.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{
  font-family:'Zpix';
  src:url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/Zpix.ttf') format('truetype');
  font-display:swap;
}
:root{
  --bg:#080b14; --line:#22304d;
  --cyan:#4ee1ff; --pink:#ff5fa2; --purple:#b388ff; --yellow:#ffe066;
  --green:#5dff9e; --red:#ff6b6b; --orange:#ffa94d;
  --text:#cfe3ff; --dim:#6b7fa8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--text); font-size:14px;
  font-family:"Consolas","Courier New",Menlo,"Microsoft YaHei",monospace;
  overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:
    linear-gradient(rgba(78,225,255,.03) 1px, transparent 1px) 0 0/100% 3px,
    radial-gradient(circle at 15% 0%, rgba(78,225,255,.07), transparent 45%),
    radial-gradient(circle at 88% 12%, rgba(255,95,162,.06), transparent 45%);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a0f1c}
::-webkit-scrollbar-thumb{background:#22304d;border:2px solid #0a0f1c}

.pixel-title{
  font-family:'Zpix','SimHei','Microsoft YaHei',monospace;
  font-weight:normal;
  letter-spacing:4px;
  line-height:1.3;
  color:transparent;
  background:linear-gradient(90deg,#4ee1ff 0%,#7ebeff 30%,#b388ff 60%,#ff5fa2 100%);
  -webkit-background-clip:text;
  background-clip:text;
  text-shadow:0 0 20px rgba(78,225,255,.35);
  image-rendering:pixelated;
  user-select:none;
}
#titleBox{text-align:center; margin:0 auto; padding:10px 0; line-height:1.15}
#titleBox .title-line1{font-size:clamp(40px, 7.5vw, 96px); letter-spacing:4px; display:block}
#titleBox .title-line2{font-size:clamp(28px, 5vw, 64px); letter-spacing:6px; display:block; margin-top:6px}
#logoBox{font-size:17px; letter-spacing:2px; flex:none}

.btn{
  font-family:inherit; font-size:13px; cursor:pointer;
  background:linear-gradient(180deg,#1b2a47,#101a2e); color:var(--cyan);
  border:2px solid var(--cyan); padding:7px 14px;
  box-shadow:3px 3px 0 rgba(78,225,255,.22); transition:.12s; white-space:nowrap;
}
.btn:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 rgba(78,225,255,.3)}
.btn:active{transform:translate(2px,2px); box-shadow:0 0 0}
.btn.pink{color:var(--pink); border-color:var(--pink)}
.btn.green{color:var(--green); border-color:var(--green)}
.btn.yellow{color:var(--yellow); border-color:var(--yellow)}
.btn.red{color:var(--red); border-color:var(--red)}
.btn.purple{color:var(--purple); border-color:var(--purple)}
.btn.ghost{color:var(--dim); border-color:var(--line); box-shadow:3px 3px 0 rgba(34,48,77,.6)}
.btn.ghost:hover{color:var(--text); border-color:#3a4d75}
.btn.sm{padding:4px 9px; font-size:12px; box-shadow:2px 2px 0 rgba(78,225,255,.2)}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none!important}

input,select,textarea{
  width:100%; font-family:inherit; font-size:13px; color:var(--text);
  background:#0a0f1c; border:2px solid var(--line); padding:9px 11px; outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
textarea{resize:vertical; min-height:80px; line-height:1.6; font-family:inherit}
label{display:block; font-size:12px; color:var(--dim); margin:0 0 5px; letter-spacing:1px}
.field{margin-bottom:14px}
.row{display:flex; gap:12px; flex-wrap:wrap}
.row>*{flex:1; min-width:150px}

.card{
  background:linear-gradient(180deg,rgba(19,27,46,.9),rgba(14,20,36,.9));
  border:2px solid var(--line); padding:16px; position:relative;
}
.card::before{content:''; position:absolute; left:-2px; top:-2px; width:14px; height:14px; border-left:3px solid var(--cyan); border-top:3px solid var(--cyan)}
.card::after{content:''; position:absolute; right:-2px; bottom:-2px; width:14px; height:14px; border-right:3px solid var(--cyan); border-bottom:3px solid var(--cyan)}
.card h3{font-size:14px; letter-spacing:2px; color:var(--cyan); margin-bottom:14px; font-weight:700}

.tag{display:inline-block; font-size:11px; padding:2px 8px; border:1px solid currentColor; letter-spacing:1px; line-height:1.5}
.tag.cyan{color:var(--cyan)} .tag.pink{color:var(--pink)} .tag.purple{color:var(--purple)}
.tag.yellow{color:var(--yellow)} .tag.green{color:var(--green)} .tag.red{color:var(--red)}
.tag.dim{color:var(--dim)} .tag.orange{color:var(--orange)}

table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle}
th{color:var(--dim); font-size:11px; letter-spacing:1px; font-weight:400; background:rgba(10,15,28,.6)}
tbody tr:hover{background:rgba(78,225,255,.04)}
.mono{font-family:"Consolas",monospace; letter-spacing:.5px}
.dim{color:var(--dim)}
.table-wrap{overflow-x:auto}

#loadingScreen{display:none; place-items:center; min-height:100vh; font-size:14px; color:var(--cyan); letter-spacing:4px; position:fixed; inset:0; background:var(--bg); z-index:999}
#loadingScreen.on{display:grid}

#loginPage{min-height:100vh; display:none; flex-direction:column; align-items:center; justify-content:center; padding:30px 16px; position:relative; z-index:2}
#loginPage.on{display:flex}
.title-box{width:100%; max-width:1000px; text-align:center; margin-bottom:10px}
.subtitle{margin-top:12px; font-size:12px; letter-spacing:8px; color:var(--dim); text-transform:uppercase}
.divider{width:min(560px,90vw); height:2px; margin:22px auto; background:repeating-linear-gradient(90deg,var(--cyan) 0 6px,transparent 6px 12px); opacity:.5}
.login-card{width:min(420px,92vw); background:rgba(14,20,36,.92); border:2px solid var(--line); padding:26px 24px; position:relative}
.login-card::before,.login-card::after{content:''; position:absolute; width:16px; height:16px}
.login-card::before{left:-2px;top:-2px;border-left:3px solid var(--pink);border-top:3px solid var(--pink)}
.login-card::after{right:-2px;bottom:-2px;border-right:3px solid var(--pink);border-bottom:3px solid var(--pink)}
.login-card h2{font-size:13px; letter-spacing:4px; color:var(--pink); margin-bottom:20px; text-align:center}
.guest-btn{margin-top:12px; width:100%; padding:10px; letter-spacing:2px}

#appPage{display:none; min-height:100vh; position:relative; z-index:2}
#appPage.on{display:block}
.topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px; padding:9px 16px; background:rgba(8,11,20,.94); border-bottom:2px solid var(--line); backdrop-filter:blur(8px)}
.topbar .spacer{flex:1}
.user-chip{display:flex; align-items:center; gap:8px; font-size:12px; padding:5px 11px; border:2px solid var(--line); background:rgba(10,15,28,.7)}
.avatar{width:22px; height:22px; display:grid; place-items:center; font-size:11px; background:linear-gradient(135deg,var(--cyan),var(--purple)); color:#06101f; font-weight:700; flex:none}
.layout{display:flex; min-height:calc(100vh - 53px)}
.sidebar{width:200px; flex:0 0 200px; border-right:2px solid var(--line); padding:12px 9px; background:rgba(10,14,26,.55)}
.nav-item{display:flex; align-items:center; gap:9px; padding:9px 11px; font-size:13px; color:var(--dim); cursor:pointer; border-left:3px solid transparent; transition:.13s; user-select:none}
.nav-item:hover{color:var(--text); background:rgba(78,225,255,.05)}
.nav-item.on{color:var(--cyan); border-left-color:var(--cyan); background:rgba(78,225,255,.08)}
.nav-item .ic{font-size:14px; width:16px; text-align:center}
.nav-sep{height:1px; background:var(--line); margin:10px 6px}
.content{flex:1; padding:18px; min-width:0; overflow-x:hidden}

.page-head{display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap}
.page-head h2{font-size:16px; letter-spacing:3px; color:var(--text); font-weight:700}
.page-head h2::before{content:'▍'; color:var(--cyan); margin-right:4px}
.page-head .spacer{flex:1}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px}
.stat{border:2px solid var(--line); padding:14px; background:linear-gradient(180deg,rgba(19,27,46,.85),rgba(14,20,36,.7)); position:relative; overflow:hidden}
.stat .num{font-size:26px; font-weight:700; letter-spacing:1px; line-height:1.2}
.stat .lbl{font-size:11px; color:var(--dim); letter-spacing:2px; margin-top:4px}
.stat .bg{position:absolute; right:-6px; bottom:-14px; font-size:52px; opacity:.06; pointer-events:none}

.task{border:2px solid var(--line); border-left-width:4px; padding:13px 15px; margin-bottom:12px; background:linear-gradient(180deg,rgba(19,27,46,.7),rgba(14,20,36,.55))}
.task.p-urgent{border-left-color:var(--red)}
.task.p-high{border-left-color:var(--orange)}
.task.p-normal{border-left-color:var(--cyan)}
.task.p-low{border-left-color:var(--dim)}
.task .t-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:7px}
.task .t-head h4{font-size:14px; font-weight:700; color:var(--text)}
.task .t-desc{font-size:12.5px; color:#9fb4d8; line-height:1.75; margin-bottom:9px; white-space:pre-wrap; word-break:break-word}
.task .t-meta{display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); margin-bottom:10px}
.task .t-meta b{color:#8ea6cd; font-weight:400}
.task .t-actions{display:flex; gap:8px; flex-wrap:wrap}
.overdue{color:var(--red)!important}

.sub-list{margin:8px 0 10px; border-top:1px dashed var(--line); padding-top:8px}
.sub-item{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px}
.sub-item .nm{width:90px; color:#9fb4d8; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sub-bar{flex:1; height:6px; background:#0a0f1c; border:1px solid var(--line); position:relative; min-width:60px}
.sub-bar i{display:block; height:100%; background:repeating-linear-gradient(90deg,var(--cyan) 0 4px,var(--purple) 4px 8px)}

.empty{text-align:center; padding:40px 16px; color:var(--dim); font-size:13px; letter-spacing:1px}
.empty .big{font-size:34px; display:block; margin-bottom:10px; opacity:.5}

#modalRoot{display:none; position:fixed; inset:0; z-index:200}
.mask{position:absolute; inset:0; background:rgba(4,7,14,.82); backdrop-filter:blur(3px); display:grid; place-items:center; padding:18px; overflow-y:auto}
.modal{width:100%; max-width:520px; max-height:88vh; display:flex; flex-direction:column; background:linear-gradient(180deg,#131b2e,#0e1424); border:2px solid var(--cyan); box-shadow:6px 6px 0 rgba(78,225,255,.18); margin:auto}
.modal.wide{max-width:820px}
.modal-head{display:flex; align-items:center; padding:12px 16px; border-bottom:2px solid var(--line); font-size:13px; letter-spacing:2px; color:var(--cyan); flex:none}
.modal-head .x{margin-left:auto; background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; line-height:1; padding:0 4px; font-family:inherit}
.modal-head .x:hover{color:var(--pink)}
.modal-body{padding:18px 16px; overflow-y:auto; flex:1}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:12px 16px; border-top:2px solid var(--line); flex:none}

#toastRoot{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{padding:9px 20px; font-size:13px; border:2px solid; background:rgba(10,15,28,.96); letter-spacing:1px; box-shadow:4px 4px 0 rgba(0,0,0,.5)}
.toast.ok{color:var(--green); border-color:var(--green)}
.toast.err{color:var(--red); border-color:var(--red)}
.toast.info{color:var(--cyan); border-color:var(--cyan)}

.announce{border:2px solid var(--line); border-left:4px solid var(--purple); padding:12px 15px; margin-bottom:10px; background:rgba(19,27,46,.5)}
.announce h4{font-size:13px; color:var(--purple); margin-bottom:6px}
.announce p{font-size:12.5px; color:#9fb4d8; line-height:1.8; white-space:pre-wrap}
.announce .time{font-size:11px; color:var(--dim); margin-top:7px}

.log-item{display:flex; gap:12px; padding:8px 4px; border-bottom:1px solid rgba(34,48,77,.55); font-size:12.5px}
.log-item .t{color:var(--dim); flex:none; font-size:11.5px}
.log-item .m{color:#9fb4d8; word-break:break-all}

.pwd-old{color:var(--dim); text-decoration:line-through}
.pwd-new{color:var(--yellow)}

.sync-bar{position:fixed; bottom:0; left:0; right:0; z-index:150; padding:6px 16px; font-size:11.5px; display:flex; align-items:center; gap:10px; background:rgba(8,11,20,.92); border-top:1px solid var(--line); transform:translateY(100%); transition:.25s}
.sync-bar.on{transform:translateY(0)}
.sync-dot{width:8px; height:8px; border-radius:50%; background:var(--green); flex:none}
.sync-dot.busy{background:var(--yellow); animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.3}}

.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px}
.g-item{border:2px solid var(--line); background:#0a0f1c; position:relative; overflow:hidden}
.g-item:hover{border-color:var(--cyan)}
.g-item img{width:100%; height:150px; object-fit:cover; display:block; cursor:zoom-in}
.g-item .cap{padding:8px 10px; font-size:12px; color:#9fb4d8; line-height:1.6; border-top:1px solid var(--line); word-break:break-word}
.g-item .cap .tm{font-size:10.5px; color:var(--dim); margin-top:3px}
.g-item .del{position:absolute; top:6px; right:6px; opacity:0; transition:.15s}
.g-item:hover .del{opacity:1}

.post{border:2px solid var(--line); padding:14px; margin-bottom:14px; background:linear-gradient(180deg,rgba(19,27,46,.7),rgba(14,20,36,.55))}
.post:hover{border-color:#31456e}
.post-head{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.post-head .avatar{width:34px;height:34px;font-size:15px}
.post-head .who{flex:1; min-width:0}
.post-head .who .nm{font-size:13px; color:var(--text)}
.post-head .who .mt{font-size:11px; color:var(--dim); margin-top:2px}
.post-body{font-size:13px; line-height:1.85; color:#b9cbe8; white-space:pre-wrap; word-break:break-word; margin-bottom:10px}
.post-imgs{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; margin-bottom:10px}
.post-imgs img{width:100%; height:120px; object-fit:cover; border:2px solid var(--line); cursor:zoom-in; display:block}
.post-foot{display:flex; align-items:center; gap:14px; font-size:12px; color:var(--dim); border-top:1px dashed var(--line); padding-top:10px}
.post-foot .lk{cursor:pointer; user-select:none; transition:.13s}
.post-foot .lk:hover{color:var(--cyan)}
.post-foot .lk.on{color:var(--pink)}
.post-foot .del{margin-left:auto}
.cmt{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px}
.cmt-item{display:flex; gap:8px; padding:5px 0; font-size:12.5px; line-height:1.7}
.cmt-item .cn{color:var(--purple); flex:none; font-weight:700}
.cmt-item .ct{color:#9fb4d8; word-break:break-word; flex:1}
.cmt-item .cx{color:var(--dim); cursor:pointer; flex:none; font-size:11px}
.cmt-item .cx:hover{color:var(--red)}
.cmt-input{display:flex; gap:8px; margin-top:9px}
.cmt-input input{padding:6px 10px; font-size:12.5px}

.img-view{position:fixed; inset:0; z-index:400; background:rgba(2,4,9,.95); display:grid; place-items:center; padding:24px; cursor:zoom-out}
.img-view img{max-width:100%; max-height:100%; border:2px solid var(--cyan)}

.coop{border:2px solid var(--line); border-left:4px solid var(--cyan); padding:13px 15px; margin-bottom:12px; background:linear-gradient(180deg,rgba(19,27,46,.7),rgba(14,20,36,.55))}
.coop .c-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:8px}
.coop .c-head h4{font-size:14px; color:var(--text); font-weight:700}
.coop .c-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); margin-bottom:8px}
.coop .c-desc{font-size:12.5px; color:#9fb4d8; line-height:1.8; white-space:pre-wrap; padding:10px; background:rgba(10,15,28,.5); border:1px dashed var(--line); margin-bottom:9px}

.apply{border:2px solid var(--line); border-left:4px solid var(--pink); padding:13px 15px; margin-bottom:12px; background:linear-gradient(180deg,rgba(19,27,46,.7),rgba(14,20,36,.55))}
.apply .a-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:8px}
.apply .a-head h4{font-size:14px; color:var(--text); font-weight:700}
.apply .a-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); margin-bottom:8px}
.apply .a-desc{font-size:12.5px; color:#9fb4d8; line-height:1.8; white-space:pre-wrap; padding:10px; background:rgba(10,15,28,.5); border:1px dashed var(--line); margin-bottom:9px}

.activity{border:2px solid var(--line); border-left:4px solid var(--green); padding:14px; margin-bottom:14px; background:linear-gradient(180deg,rgba(19,27,46,.7),rgba(14,20,36,.55))}
.activity h4{font-size:15px; color:var(--green); margin-bottom:8px}
.activity .a-body{font-size:13px; color:#b9cbe8; line-height:1.85; white-space:pre-wrap; margin-bottom:12px}
.activity .a-imgs{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; margin-bottom:10px}
.activity .a-imgs img{width:100%; height:120px; object-fit:cover; border:2px solid var(--line); cursor:zoom-in; display:block}
.activity .a-meta{font-size:11px; color:var(--dim); border-top:1px dashed var(--line); padding-top:8px}

.guest-banner{
  background:linear-gradient(90deg,rgba(255,224,102,.12),rgba(255,95,162,.12));
  border:2px solid var(--yellow);
  padding:10px 16px; margin-bottom:16px; font-size:12.5px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.guest-banner .ic{font-size:18px}
.guest-banner .txt{flex:1; color:#e8e0b8}

.forum-locked{
  text-align:center; padding:60px 20px;
  border:2px solid var(--red); background:rgba(255,107,107,.05);
}
.forum-locked .lock-icon{font-size:52px; opacity:.5; margin-bottom:14px}
.forum-locked .lock-title{font-size:15px; color:var(--red); letter-spacing:3px; margin-bottom:10px}
.forum-locked .lock-desc{font-size:12.5px; color:var(--dim); line-height:1.9}

@media (max-width:820px){
  .layout{flex-direction:column}
  .sidebar{width:100%; flex:none; border-right:none; border-bottom:2px solid var(--line); display:flex; overflow-x:auto; gap:4px; padding:8px}
  .nav-item{border-left:none; border-bottom:3px solid transparent; white-space:nowrap; padding:7px 11px}
  .nav-item.on{border-left:none; border-bottom-color:var(--cyan)}
  .nav-sep{display:none}
  .content{padding:12px}
  .user-chip .uname{display:none}
}

body.mobile{font-size:13px}
body.mobile .topbar{padding:8px 12px; gap:8px}
body.mobile #logoBox{font-size:14px; letter-spacing:1px}
body.mobile .user-chip{padding:4px 8px; gap:6px; font-size:11px}
body.mobile .user-chip .uname{display:none}
body.mobile .layout{flex-direction:column}
body.mobile .sidebar{
  position:fixed; bottom:0; left:0; right:0;
  width:100%; flex:none; border-right:none;
  border-top:2px solid var(--line);
  background:rgba(8,11,20,.97);
  backdrop-filter:blur(8px);
  display:flex; overflow-x:auto; overflow-y:hidden;
  padding:6px 4px; gap:2px; z-index:60;
  scrollbar-width:none;
}
body.mobile .sidebar::-webkit-scrollbar{display:none}
body.mobile .nav-item{
  flex:0 0 auto; flex-direction:column; gap:3px;
  padding:6px 10px; border-left:none;
  border-top:2px solid transparent; border-bottom:none;
  font-size:10.5px; min-width:56px; text-align:center;
}
body.mobile .nav-item .ic{font-size:18px; width:auto}
body.mobile .nav-item.on{
  border-left:none; border-top-color:var(--cyan);
  background:transparent;
  text-shadow:0 0 8px rgba(78,225,255,.5);
}
body.mobile .nav-sep{display:none}
body.mobile .content{padding:12px 12px 80px}
body.mobile .page-head{flex-direction:column; align-items:stretch; gap:8px; margin-bottom:12px}

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
function fmtTime(t){ if(!t) return '—'; const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDate(t){ if(!t) return ''; const d=new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayStr(){ return fmtDate(Date.now()); }
function toast(msg, type='ok'){
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(()=>{ el.style.transition='.3s'; el.style.opacity='0'; el.style.transform='translateY(-10px)'; }, 2100);
  setTimeout(()=>el.remove(), 2600);
}
function relTime(t){
  const d = Date.now() - new Date(t).getTime();
  if(d < 60000) return '刚刚';
  if(d < 3600000) return Math.floor(d/60000) + ' 分钟前';
  if(d < 86400000) return Math.floor(d/3600000) + ' 小时前';
  if(d < 2592000000) return Math.floor(d/86400000) + ' 天前';
  return fmtTime(t);
}
let syncTimer = null;
function showSync(text, busy){
  const bar = $('#syncBar'), dot = $('#syncDot');
  if(!bar) return;
  bar.classList.add('on'); $('#syncText').textContent = text;
  dot.classList.toggle('busy', !!busy);
  clearTimeout(syncTimer);
  if(!busy) syncTimer = setTimeout(()=>bar.classList.remove('on'), 1800);
}

function detectDevice(){
  const ua = navigator.userAgent || '';
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  const width = window.innerWidth;
  const uaMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Windows Phone/i.test(ua);
  const isMobile = (uaMobile && width < 1024) || (isTouch && width < 820);
  document.body.classList.toggle('mobile', isMobile);
  document.body.classList.toggle('desktop', !isMobile);
}

let adminKey = localStorage.getItem('xudata_admin_key') || '';

const cache = {
  users: [], tasks: [], taskAssignees: [], taskHistory: [],
  announcements: [], gallery: [], activities: [],
  posts: [], postsGuest: [], likes: [], comments: [],
  cooperations: [], applications: [], logs: [], settings: {}
};
let session = null;
let guestMode = false;
let currentView = 'gallery';
let memberDeptFilter = 'all';
let guestBoardView = 'member';

const GUEST_ALLOWED = ['gallery','coop','join','activity','guestforum'];

async function loadAll(){
  showSync('正在同步云端数据…', true);
  const [u, t, ta, th, a, g, act, p, pg, l, c, cp, ap, lg, st] = await Promise.all([
    sb.from('users').select('*').order('created_at'),
    sb.from('tasks').select('*').order('created_at', { ascending:false }),
    sb.from('task_assignees').select('*'),
    sb.from('task_history').select('*').order('created_at'),
    sb.from('announcements').select('*').order('created_at', { ascending:false }),
    sb.from('gallery').select('*').order('created_at', { ascending:false }),
    sb.from('activities').select('*').order('created_at', { ascending:false }),
    sb.from('posts').select('*').order('created_at', { ascending:false }),
    sb.from('posts_guest').select('*').order('created_at', { ascending:false }),
    sb.from('post_likes').select('*'),
    sb.from('comments').select('*').order('created_at'),
    sb.from('cooperations').select('*').order('created_at', { ascending:false }),
    sb.from('applications').select('*').order('created_at', { ascending:false }),
    sb.from('logs').select('*').order('created_at', { ascending:false }).limit(300),
    sb.from('settings').select('*')
  ]);
  if(u.error) throw u.error;
  cache.users = u.data || [];
  cache.tasks = t.data || [];
  cache.taskAssignees = ta.data || [];
  cache.taskHistory = th.data || [];
  cache.announcements = a.data || [];
  cache.gallery = g.data || [];
  cache.activities = act.data || [];
  cache.posts = p.data || [];
  cache.postsGuest = pg.data || [];
  cache.likes = l.data || [];
  cache.comments = c.data || [];
  cache.cooperations = cp.data || [];
  cache.applications = ap.data || [];
  cache.logs = lg.data || [];
  cache.settings = {};
  (st.data || []).forEach(s => { cache.settings[s.key] = s.value; });
  showSync('已同步 · ' + fmtTime(Date.now()), false);
}

function currentUser(){ return session ? cache.users.find(u => u.id === session) || null : null; }
function userName(id){ const u = cache.users.find(x => x.id === id); return u ? u.name : '已注销'; }
function userDept(id){ const u = cache.users.find(x => x.id === id); return u ? (u.dept||'未分组') : '—'; }
function getTaskAssignees(taskId){ return cache.taskAssignees.filter(x => x.task_id === taskId); }
function getMySub(taskId, userId){ return cache.taskAssignees.find(x => x.task_id === taskId && x.user_id === userId) || null; }
function getTaskHistory(taskId){ return cache.taskHistory.filter(x => x.task_id === taskId); }
function getPostLikes(postId){ return cache.likes.filter(x => x.post_id === postId); }
function getPostComments(postId){ return cache.comments.filter(x => x.post_id === postId); }

function getRole(){
  if(guestMode) return 'guest';
  const u = currentUser();
  return u ? u.role : 'guest';
}

const PRI_MAP = { urgent:{label:'紧急',cls:'red'}, high:{label:'高',cls:'orange'}, normal:{label:'普通',cls:'cyan'}, low:{label:'低',cls:'dim'} };
const STATUS_MAP = { pending:{label:'待接受',cls:'yellow'}, doing:{label:'进行中',cls:'cyan'}, review:{label:'待审核',cls:'purple'}, done:{label:'已完成',cls:'green'} };

function taskOverall(t){
  const subs = getTaskAssignees(t.id);
  if(!subs.length) return 'pending';
  if(subs.every(s => s.status === 'done')) return 'done';
  if(subs.some(s => s.status === 'review')) return 'review';
  if(subs.some(s => s.status === 'doing')) return 'doing';
  return 'pending';
}
function taskVisible(u, t){
  if(!u) return false;
  if(u.role === 'admin') return true;
  return getTaskAssignees(t.id).some(s => s.user_id === u.id);
}
function isOverdue(t){
  if(!t.deadline || taskOverall(t) === 'done') return false;
  return t.deadline < todayStr();
}

async function log(type, text, actor){
  try{ await sb.from('logs').insert({ type, text, actor: actor || '系统' }); }
  catch(e){ console.warn('日志写入失败', e); }
}

/* ================= 登录 / 游客 ================= */
async function doLogin(username, password){
  username = username.trim();
  if(!username || !password) return { ok:false, msg:'账号和密码不能为空' };

  const { data, error } = await sb.rpc('verify_login', {
    p_username: username,
    p_password: password
  });

  if(error){ console.error(error); return { ok:false, msg:'登录失败：'+error.message }; }
  if(!data || !data.length || !data[0].ok){
    const u = cache.users.find(x => x.username.toLowerCase() === username.toLowerCase());
    if(!u) return { ok:false, msg:'账号不存在' };
    if(!u.active) return { ok:false, msg:'该账号已被禁用，请联系管理员' };
    return { ok:false, msg:'密码错误' };
  }

  const u = cache.users.find(x => x.id === data[0].user_id);
  if(!u || !u.active) return { ok:false, msg:'该账号已被禁用' };

  session = u.id;
  guestMode = false;
  localStorage.setItem('xudata_session', u.id);
  localStorage.removeItem('xudata_guest');
  await log('登录', `用户 ${u.name}（${u.username}）登录系统`, u.name);
  return { ok:true };
}
function enterGuest(){
  session = null;
  guestMode = true;
  localStorage.setItem('xudata_guest', '1');
  localStorage.removeItem('xudata_session');
  currentView = 'gallery';
  showGuestApp();
  toast('已进入游客模式', 'info');
}
async function logout(){
  const u = currentUser();
  if(u){ await log('登录', `用户 ${u.name} 退出系统`, u.name); }
  session = null;
  guestMode = false;
  localStorage.removeItem('xudata_session');
  localStorage.removeItem('xudata_guest');
  $('#appPage').classList.remove('on');
  $('#loginPage').classList.add('on');
  $('#loginForm').reset();
  toast('已安全退出', 'info');
}

function showGuestApp(){
  $('#loginPage').classList.remove('on');
  $('#appPage').classList.add('on');
  $('#avatarBox').textContent = '游';
  $('#topName').textContent = '游客';
  $('#topRole').innerHTML = '<span class="tag yellow">访客</span>';
  $('#sidebar').innerHTML = NAV_ITEMS.filter(it => !it.sep && it.roles.includes('guest')).map(it =>
    `<div class="nav-item ${currentView===it.id?'on':''}" data-nav="${it.id}"><span class="ic">${it.icon}</span><span>${it.label}</span></div>`
  ).join('');
  renderView();
}

function showApp(){
  const u = currentUser();
  if(!u){ logout(); return; }
  guestMode = false;
  $('#loginPage').classList.remove('on');
  $('#appPage').classList.add('on');
  $('#avatarBox').textContent = (u.name || u.username).slice(0,1);
  $('#topName').textContent = u.name;
  $('#topRole').innerHTML = u.role==='admin' ? '<span class="tag pink">管理员</span>' : '<span class="tag cyan">社员</span>';

  if(u.role === 'admin' && !adminKey){
    setTimeout(() => {
      openModal({
        title: '🔑 管理员密钥',
        okText: '保存', cancelText: '稍后',
        html: `
          <div style="font-size:13px;line-height:2;margin-bottom:14px">
            请输入你的管理员密钥（用于查看社员密码）。
            <br><span style="color:var(--yellow)">只存本机浏览器，不会上传。</span>
          </div>
          <div class="field">
            <input id="adminKeyInput" placeholder="粘贴 64 位密钥" autocomplete="off">
          </div>`,
        onOk(root){
          const k = root.querySelector('#adminKeyInput').value.trim();
          if(k && k.length >= 16){
            adminKey = k;
            localStorage.setItem('xudata_admin_key', k);
            toast('密钥已保存', 'ok');
            renderView();
          }
        }
      });
    }, 500);
  }

  $('#sidebar').innerHTML = NAV_ITEMS.map(it=>{
    if(it.sep) return '<div class="nav-sep"></div>';
    if(!it.roles.includes(u.role)) return '';
    return `<div class="nav-item ${currentView===it.id?'on':''}" data-nav="${it.id}"><span class="ic">${it.icon}</span><span>${it.label}</span></div>`;
  }).join('');
  renderView();
}

function switchView(v){
  const role = getRole();
  const item = NAV_ITEMS.find(i=>i.id===v);
  if(!item || !item.roles.includes(role)) return;
  currentView = v;
  $$('.nav-item').forEach(n=>n.classList.toggle('on', n.dataset.nav===v));
  renderView();
  if(document.body.classList.contains('mobile')){
    window.scrollTo({ top:0, behavior:'smooth' });
  }
}

function renderView(){
  const u = currentUser();

  if(!guestMode){
    if(!u){ logout(); return; }
    if(!u.active){ toast('你的账号已被禁用','err'); logout(); return; }
  }

  if(guestMode && !GUEST_ALLOWED.includes(currentView)){
    currentView = 'gallery';
  }

  const map = {
    dashboard:viewDashboard, tasks:viewTasks, forum:viewForum,
    gallery:viewGallery, activity:viewActivity, coop:viewCoop, join:viewJoin,
    guestforum:viewGuestForum,
    members:viewMembers, announce:viewAnnounce, logs:viewLogs, data:viewData,
    password:viewPassword, profile:viewProfile
  };
  const fn = map[currentView];
  $('#content').innerHTML = fn ? fn(u) : '<div class="empty">页面不存在</div>';
}

function viewDashboard(u){
  if(!u) return '<div class="empty">请先登录</div>';
  const isAd = u.role==='admin';
  const scope = cache.tasks.filter(t => taskVisible(u, t));
  const pendingCoop = cache.cooperations.filter(c => c.status === 'pending').length;
  const pendingApply = cache.applications.filter(a => a.status === 'pending').length;
  const statCards = isAd ? `
    <div class="stat"><div class="num" style="color:var(--cyan)">${cache.users.filter(x=>x.role==='member').length}</div><div class="lbl">社员总数</div><div class="bg">☰</div></div>
    <div class="stat"><div class="num" style="color:var(--pink)">${cache.users.filter(x=>x.role==='admin').length}</div><div class="lbl">管理员</div><div class="bg">★</div></div>
    <div class="stat"><div class="num" style="color:var(--orange)">${pendingCoop}</div><div class="lbl">合作待处理</div><div class="bg">⇄</div></div>
    <div class="stat"><div class="num" style="color:var(--yellow)">${pendingApply}</div><div class="lbl">入社待处理</div><div class="bg">⊕</div></div>
    <div class="stat"><div class="num" style="color:var(--purple)">${scope.filter(t=>taskOverall(t)==='review').length}</div><div class="lbl">待审核任务</div><div class="bg">◈</div></div>
  ` : `
    <div class="stat"><div class="num" style="color:var(--yellow)">${scope.filter(t=>(getMySub(t.id,u.id)||{}).status==='pending').length}</div><div class="lbl">待接受</div><div class="bg">◷</div></div>

/* ================= 任务中心 ================= */
let taskFilter = 'all', taskSearch = '';
function viewTasks(u){
  if(!u) return '<div class="empty">请先登录</div>';
  const isAd = u.role==='admin';
  let list = cache.tasks.filter(t => taskVisible(u, t));
  if(taskFilter !== 'all'){
    list = list.filter(t => {
      if(isAd) return taskOverall(t) === taskFilter;
      const ms = getMySub(t.id, u.id); return ms && ms.status === taskFilter;
    });
  }
  if(taskSearch.trim()){
    const k = taskSearch.trim().toLowerCase();
    list = list.filter(t => (t.title + (t.description||'')).toLowerCase().includes(k));
  }
  const cnt = k => cache.tasks.filter(t => taskVisible(u,t) && (k==='all' || (isAd ? taskOverall(t)===k : (getMySub(t.id,u.id)||{}).status===k))).length;
  const tabs = [{k:'all',l:'全部'},{k:'pending',l:'待接受'},{k:'doing',l:'进行中'},{k:'review',l:'待审核'},{k:'done',l:'已完成'}];
  const cards = list.map(t=>taskCard(t,u)).join('') || '<div class="empty"><span class="big">✦</span>暂无符合条件的任务</div>';
  return `
    <div class="page-head"><h2>${isAd?'任务中心':'我的任务'}</h2><div class="spacer"></div>
      <input id="taskSearchInput" placeholder="搜索任务…" value="${esc(taskSearch)}" style="width:180px;padding:6px 10px;font-size:12px">
      ${isAd?'<button class="btn" data-act="new-task">+ 发布任务</button>':''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      ${tabs.map(t=>`<button class="btn sm ${taskFilter===t.k?'':'ghost'}" data-act="task-filter" data-k="${t.k}">${t.l} <span class="dim">(${cnt(t.k)})</span></button>`).join('')}
    </div>
    <div id="taskList">${cards}</div>`;
}
function taskCard(t, u){
  const isAd = u.role === 'admin';
  const pri = PRI_MAP[t.priority] || PRI_MAP.normal;
  const overall = taskOverall(t);
  const st = STATUS_MAP[overall];
  const overdue = isOverdue(t);
  const sub = getMySub(t.id, u.id);
  const assigns = getTaskAssignees(t.id);

  const subList = assigns.map(s => {
    const aid = s.user_id;
    const pct = s.status==='done' ? 100 : (s.status==='review' ? 80 : (s.status==='doing' ? 45 : 0));
    const sc = STATUS_MAP[s.status] || STATUS_MAP.pending;
    return `<div class="sub-item">
      <span class="nm" title="${esc(userName(aid))}">${esc(userName(aid))}</span>
      <span class="sub-bar"><i style="width:${pct}%"></i></span>
      <span class="tag ${sc.cls}" style="font-size:10px;padding:1px 6px">${sc.label}</span>
    </div>`;
  }).join('');

  let actions = '';
  if(!isAd && sub){
    if(sub.status === 'pending') actions += `<button class="btn sm" data-act="accept-task" data-id="${t.id}">接受任务</button>`;
    if(sub.status === 'doing')   actions += `<button class="btn sm yellow" data-act="submit-task" data-id="${t.id}">提交完成</button>`;
  }
  if(isAd){
    const reviewOnes = assigns.filter(s => s.status === 'review');
    reviewOnes.forEach(s => {
      actions += `<button class="btn sm green" data-act="approve-one" data-id="${t.id}" data-uid="${s.user_id}">✓通过 ${esc(userName(s.user_id))}</button>`;
      actions += `<button class="btn sm yellow" data-act="reject-one" data-id="${t.id}" data-uid="${s.user_id}">✗打回 ${esc(userName(s.user_id))}</button>`;
    });
    actions += `<button class="btn sm red" data-act="del-task" data-id="${t.id}">删除</button>`;
  }
  actions += `<button class="btn sm ghost" data-act="task-detail" data-id="${t.id}">详情</button>`;

  return `
    <div class="task p-${t.priority}">
      <div class="t-head">
        <span class="tag ${pri.cls}">${pri.label}</span>
        <h4>${esc(t.title)}</h4>
        <span class="tag ${st.cls}">${st.label}</span>
        ${overdue ? '<span class="tag red">已逾期</span>' : ''}
        ${!isAd && sub ? `<span class="tag cyan" style="margin-left:auto">我的进度：${(STATUS_MAP[sub.status]||STATUS_MAP.pending).label}</span>` : ''}
      </div>
      <div class="t-desc">${esc(t.description||'')}</div>
      <div class="t-meta">
        <span>指派：<b>${assigns.map(s=>userName(s.user_id)+'('+userDept(s.user_id)+')').join('、')||'未指派'}</b></span>
        <span>发布：<b>${esc(userName(t.created_by))}</b></span>
        <span>截止：<b class="${overdue?'overdue':''}">${esc(t.deadline||'无')}</b></span>
      </div>
      <div class="sub-list">${subList}</div>
      <div class="t-actions">${actions}</div>
    </div>`;
}

/* ================= 模态框 ================= */
function openModal({ title, html, okText='确定', cancelText='取消', wide=false, onOk, onMount }){
  const root = $('#modalRoot');
  root.style.display = 'block';
  root.innerHTML = `
    <div class="mask"><div class="modal ${wide?'wide':''}">
      <div class="modal-head">${esc(title)}<button class="x" data-close>×</button></div>
      <div class="modal-body">${html}</div>
      <div class="modal-foot">${cancelText!==''?`<button class="btn ghost" data-close>${esc(cancelText)}</button>`:''}<button class="btn" id="modalOkBtn">${esc(okText)}</button></div>
    </div></div>`;
  const close = ()=>{ root.style.display='none'; root.innerHTML=''; };
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  root.querySelector('.mask').addEventListener('mousedown', e=>{ if(e.target.classList.contains('mask')) close(); });
  root.querySelector('#modalOkBtn').onclick = ()=>{ if(onOk && onOk(root, close)===false) return; close(); };
  if(onMount) onMount(root, close);
  return { root, close };
}
function closeModal(){ $('#modalRoot').style.display='none'; $('#modalRoot').innerHTML=''; }

function compressImage(file, maxW = 1000, quality = 0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadDataUrl(dataUrl, prefix){
  const fileName = `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;
  const blob = await (await fetch(dataUrl)).blob();
  const { error } = await sb.storage.from('gallery').upload(fileName, blob, { contentType:'image/jpeg' });
  if(error) throw error;
  const { data: pub } = sb.storage.from('gallery').getPublicUrl(fileName);
  return pub.publicUrl;
}

    }).join('');
    const html = `

      <div class="field"><label>任务描述</label><textarea id="ntDesc"></textarea></div>
      <div class="row">
        <div class="field"><label>优先级</label><select id="ntPri"><option value="normal">普通</option><option value="low">低</option><option value="high">高</option><option value="urgent">紧急</option></select></div>

            <input type="checkbox" class="nt-user" value="${m.id}" data-dept="${esc(m.dept||'')}" style="width:auto;margin:0">

        </div>

        close(); renderView(); toast('任务发布成功','ok');

      </tr>`;
    }).join('');
    const hist = getTaskHistory(id).slice().reverse().map(h=>`<div class="log-item"><span class="t">${fmtTime(h.created_at)}</span><span class="m">${esc(h.text)} <span class="dim">— ${esc(h.by_name)}</span></span></div>`).join('') || '<div class="dim" style="font-size:12px;padding:8px">暂无记录</div>';
    openModal({ title:'任务详情', wide:true, okText:'关闭', cancelText:'', html:`
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px"><span class="tag ${pri.cls}">${pri.label}</span><span class="tag ${STATUS_MAP[taskOverall(t)].cls}">${STATUS_MAP[taskOverall(t)].label}</span></div>
      <div style="font-size:16px;color:var(--cyan);margin-bottom:12px">${esc(t.title)}</div>
      <div style="font-size:13px;line-height:1.9;color:#9fb4d8;white-space:pre-wrap;margin-bottom:16px">${esc(t.description||'')}</div>
      <div class="table-wrap" style="margin-bottom:16px"><table>
        <thead><tr><th>成员</th><th>状态</th><th>提交说明</th><th>审核意见</th></tr></thead>
        <tbody>${subRows}</tbody>
      </table></div>
      <div style="font-size:12px;color:var(--dim);letter-spacing:1px;margin-bottom:8px">▸ 流转记录</div>${hist}` });
  },

  'batch-add'(){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    const html = `
      <div class="field"><label>部门</label>
        <select id="baDept">${DEPTS.map(d=>`<option value="${d}">${d}</option>`).join('')}</select>
      </div>
      <div class="field"><label>角色</label>
        <select id="baRole"><option value="member">普通社员</option><option value="admin">管理员</option></select>
      </div>
      <div class="field"><label>每行一个：账号 姓名</label>
        <textarea id="baList" style="min-height:150px" placeholder="zhangsan 张三
lisi 李四"></textarea>
      </div>
      <div style="font-size:12px;color:var(--dim);line-height:1.9">密码统一 123456</div>`;
    openModal({ title:'批量添加', html, okText:'创建', wide:true, async onOk(root, close){
      const dept = root.querySelector('#baDept').value;
      const role = root.querySelector('#baRole').value;
      const raw = root.querySelector('#baList').value.trim();
      if(!raw){ toast('请输入内容','err'); return false; }
      const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
      const toInsert = [];
      let skip = 0, err = 0;
      for(const line of lines){
        const m = line.match(/^(\S+)\s+(.+)$/);
        if(!m){ err++; continue; }
        const username = m[1].trim(), name = m[2].trim();
        if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){ err++; continue; }
        if(cache.users.some(x => x.username.toLowerCase() === username.toLowerCase())){ skip++; continue; }
        toInsert.push({ username, password: DEF_PWD, name, role, dept });
      }
      if(!toInsert.length){ toast(`无有效行，跳过 ${skip}，错误 ${err}`, 'err'); return false; }
      let created = 0;
      for(const item of toInsert){
        const { error } = await sb.rpc('create_user', {
          p_username: item.username, p_password: item.password,
          p_name: item.name, p_role: item.role, p_dept: item.dept,
          p_admin_key: adminKey
        });
        if(!error) created++;
      }
      if(!created){ toast('全部创建失败', 'err'); return false; }
      await log('人员', `批量添加 ${created} 个账号到 ${dept}`, u.name);
      await loadAll(); close(); renderView();
      toast(`成功创建 ${created} 个${skip?`，跳过 ${skip}`:''}${err?`，错误 ${err}`:''}`,'ok');
    }});
  },

  'add-member'(){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    const html = `
      <div class="row">
        <div class="field"><label>账号</label><input id="nmUser" autocomplete="off"></div>
        <div class="field"><label>姓名</label><input id="nmName" autocomplete="off"></div>
      </div>
      <div class="row">
        <div class="field"><label>部门</label><select id="nmDept">${DEPTS.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div>
        <div class="field"><label>角色</label><select id="nmRole"><option value="member">普通社员</option><option value="admin">管理员</option></select></div>
      </div>
      <div class="field"><label>初始密码</label><input id="nmPwd" value="${DEF_PWD}" autocomplete="off"></div>`;
    openModal({ title:'新增账号', html, okText:'创建', wide:true, async onOk(root, close){
      const username = root.querySelector('#nmUser').value.trim();
      const name = root.querySelector('#nmName').value.trim();
      const dept = root.querySelector('#nmDept').value;
      const role = root.querySelector('#nmRole').value;
      const pwd = root.querySelector('#nmPwd').value;
      if(!username || !name){ toast('账号与姓名不能为空','err'); return false; }
      if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){ toast('账号格式错误','err'); return false; }
      if(pwd.length < 6){ toast('密码至少 6 位','err'); return false; }
      if(cache.users.some(x=>x.username.toLowerCase()===username.toLowerCase())){ toast('账号已存在','err'); return false; }
      const { error } = await sb.rpc('create_user', {
        p_username: username, p_password: pwd, p_name: name,
        p_role: role, p_dept: dept, p_admin_key: adminKey
      });
      if(error){ toast('创建失败：'+error.message,'err'); return false; }
      await log('人员', `新增${role==='admin'?'管理员':'社员'}：${name}（${username}）`, u.name);
      await loadAll(); close(); renderView(); toast('创建成功','ok');
    }});
  },

  'reset-pwd'(id){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    const m = cache.users.find(x=>x.id===id); if(!m) return;
    openModal({ title:'重置密码', okText:'确认', html:`
      <div style="margin-bottom:14px">为 <b style="color:var(--cyan)">${esc(m.name)}</b> 设置新密码</div>
      <div class="field"><label>当前密码</label><input value="（已加密）" disabled></div>
      <div class="field"><label>新密码</label><input id="rpPwd" value="${DEF_PWD}" autocomplete="off"></div>`,
      async onOk(root, close){
        const np = root.querySelector('#rpPwd').value;
        if(np.length < 6){ toast('密码至少 6 位','err'); return false; }
        const { error } = await sb.rpc('admin_set_password', {
          p_user_id: id, p_new_password: np, p_admin_key: adminKey
        });
        if(error){ toast('失败：'+error.message,'err'); return false; }
        await sb.from('password_history').insert({
          user_id: id, old_pwd: '(hash)', new_pwd: '(hash)',
          mode: '管理员重置', by_name: u.name
        });
        await log('密码', `管理员 ${u.name} 重置了 ${m.name} 的密码`, u.name);
        await loadAll(); close(); renderView(); toast('已重置','ok');
      }});
  },

  'toggle-active'(id){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    const m = cache.users.find(x=>x.id===id); if(!m) return;
    if(m.id===u.id){ toast('不能禁用当前账号','err'); return; }
    (async () => {
      const { error } = await sb.from('users').update({ active: !m.active }).eq('id', id);
      if(error){ toast('失败','err'); return; }
      await log('人员', `${m.active?'禁用':'启用'} ${m.name}`, u.name);
      await loadAll(); renderView();
      toast(m.active?'已禁用':'已启用','info');
    })();
  },

  'del-member'(id){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    const m = cache.users.find(x=>x.id===id); if(!m) return;
    if(m.id===u.id){ toast('不能删除当前账号','err'); return; }
    openModal({ title:'删除账号', okText:'删除', html:`<div style="font-size:13px;line-height:2">确定删除 <b style="color:var(--pink)">${esc(m.name)}（${esc(m.username)}）</b>？</div>`,
      async onOk(){
        const { error } = await sb.from('users').delete().eq('id', id);
        if(error){ toast('删除失败：'+error.message,'err'); return; }
        await log('人员', `删除账号 ${m.name}`, u.name);
        await loadAll(); renderView(); toast('已删除','info');
      }});
  },

  'new-announce'(){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    openModal({ title:'发布公告', okText:'发布', html:`
      <div class="field"><label>标题</label><input id="anTitle"></div>
      <div class="field"><label>内容</label><textarea id="anContent" style="min-height:120px"></textarea></div>`,
      async onOk(root, close){
        const title = root.querySelector('#anTitle').value.trim();
        const content = root.querySelector('#anContent').value.trim();
        if(!title || !content){ toast('标题和内容不能为空','err'); return false; }
        const { error } = await sb.from('announcements').insert({ title, content, author: u.name });
        if(error){ toast('失败','err'); return false; }
        await log('公告', `发布公告「${title}」`, u.name);
        await loadAll(); close(); renderView(); toast('已发布','ok');
      }});
  },
  'del-announce'(id){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    openModal({ title:'删除公告', okText:'删除', html:`<div style="font-size:13px;line-height:2">确定删除？</div>`,
      async onOk(){
        const { error } = await sb.from('announcements').delete().eq('id', id);
        if(error){ toast('失败','err'); return; }
        await loadAll(); renderView(); toast('已删除','info');
      }});
  },

  'clear-logs'(){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    openModal({ title:'清空日志', okText:'清空', html:'<div style="font-size:13px;line-height:2">确定清空全部操作日志？</div>',
      async onOk(){
        const { error } = await sb.from('logs').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        if(error){ toast('失败','err'); return; }
        await loadAll(); renderView(); toast('已清空','info');
      }});
  },
  'cloud-refresh'(){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    openModal({ title:'从云端刷新', okText:'刷新', html:'<div style="font-size:13px;line-height:2">重新拉取最新数据。</div>',
      async onOk(){ await loadAll(); renderView(); toast('已刷新','ok'); }});
  },
  'export-data'(){
    const u = currentUser();
    if(!u || u.role !== 'admin') return;
    const data = {
      users: cache.users, tasks: cache.tasks, task_assignees: cache.taskAssignees,
      announcements: cache.announcements, gallery: cache.gallery, activities: cache.activities,
      posts: cache.posts, posts_guest: cache.postsGuest,
      cooperations: cache.cooperations, applications: cache.applications,
      logs: cache.logs, settings: cache.settings
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Xudata_备份_${fmtDate(Date.now())}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('已导出','ok');
  },

  'do-change-pwd'(){
    const u = currentUser();
    if(!u) return;
    const oldPwd = $('#oldPwd').value, n1 = $('#newPwd').value, n2 = $('#newPwd2').value;
    if(!oldPwd || !n1 || !n2){ toast('请完整填写','err'); return; }
    if(n1.length < 6){ toast('新密码至少 6 位','err'); return; }
    if(n1 === oldPwd){ toast('新密码不能与当前相同','err'); return; }
    if(n1 !== n2){ toast('两次输入不一致','err'); return; }
    (async () => {
      const { data, error } = await sb.rpc('change_own_password', {
        p_user_id: u.id, p_old_password: oldPwd,
        p_new_password: n1, p_admin_key: adminKey
      });
      if(error || !data){ toast('当前密码不正确','err'); return; }
      await log('密码', `${u.name} 修改了自己的密码`, u.name);
      await loadAll();
      toast('密码已修改','ok');
      renderView();
    })();
  }
};

/* ================= 事件委托 ================= */
document.addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){ switchView(nav.dataset.nav); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act === 'noop') return;
  if(act === 'task-filter'){ actions[act](el.dataset.k); return; }
  if(act === 'filter-dept'){ actions[act](el.dataset.dept); return; }
  if(act === 'view-img'){ actions[act](null, el); return; }
  if(act === 'change-dept') return;
  if(act === 'show-pwd'){ actions[act](el.dataset.id); return; }
  if(actions[act]) actions[act](el.dataset.id, el, e);
});
document.addEventListener('input', e=>{
  if(e.target.id === 'taskSearchInput'){
    taskSearch = e.target.value;
    const pos = e.target.selectionStart;
    renderView();
    const inp = $('#taskSearchInput');
    if(inp){ inp.focus(); inp.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('change', e=>{
  if(e.target.dataset.act === 'change-dept'){
    actions['change-dept'](e.target.dataset.id, e.target);
    return;
  }
  if(e.target.id === 'postImgs'){
    const files = [...(e.target.files || [])].slice(0, 4);
    forumDraftImgs = [];
    const prev = $('#postImgPreview');
    if(!prev) return;
    prev.innerHTML = '';
    (async () => {
      for(const f of files){
        if(!f.type.startsWith('image/')) continue;
        try{
          const src = await compressImage(f, 900, 0.72);
          forumDraftImgs.push(src);
          const img = document.createElement('img');
          img.src = src;
          img.style.cssText = 'width:80px;height:80px;object-fit:cover;border:2px solid var(--line)';
          prev.appendChild(img);
        }catch(err){ console.warn(err); }
      }
    })();
  }
  if(e.target.id === 'guestPostImgs'){
    const files = [...(e.target.files || [])].slice(0, 4);
    guestDraftImgs = [];
    const prev = $('#guestPostImgPreview');
    if(!prev) return;
    prev.innerHTML = '';
    (async () => {
      for(const f of files){
        if(!f.type.startsWith('image/')) continue;
        try{
          const src = await compressImage(f, 900, 0.72);
          guestDraftImgs.push(src);
          const img = document.createElement('img');
          img.src = src;
          img.style.cssText = 'width:80px;height:80px;object-fit:cover;border:2px solid var(--line)';
          prev.appendChild(img);
        }catch(err){ console.warn(err); }
      }
    })();
  }
});
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn = $('#loginBtn');
  btn.disabled = true; btn.textContent = '验证中…';
  try{
    const res = await doLogin($('#loginUser').value, $('#loginPass').value);
    if(res.ok){ $('#loginForm').reset(); showApp(); toast('登录成功','ok'); }
    else toast(res.msg,'err');
  }catch(err){ toast('登录异常：'+err.message,'err'); }
  finally{ btn.disabled = false; btn.textContent = '登 录'; }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeModal(); });

/* ================= 启动 ================= */
(async function boot(){
  detectDevice();
  window.addEventListener('resize', () => {
    clearTimeout(window._deviceTimer);
    window._deviceTimer = setTimeout(detectDevice, 200);
  });
  window.addEventListener('orientationchange', () => { setTimeout(detectDevice, 300); });

  try{
    await loadAll();
    $('#loadingScreen').classList.remove('on');
    $('#loginPage').classList.add('on');

    const sid = localStorage.getItem('xudata_session');
    const gst = localStorage.getItem('xudata_guest');
    if(sid && cache.users.some(u=>u.id===sid)){
      session = sid;
      showApp();
    }else if(gst === '1'){
      enterGuest();
    }

    setInterval(async () => {
      if(!session) return;
      const u = currentUser();
      if(!u || !u.active){ toast('账号已被禁用','err'); logout(); }
    }, 30000);
  }catch(err){
    console.error(err);
    $('#loadingScreen').innerHTML = '⚠ 云端连接失败：' + err.message + '<br><span style="font-size:12px;color:var(--dim)">请检查建表 SQL 是否执行、RLS 策略是否正确</span>';
  }
})();
</script>
</body>
